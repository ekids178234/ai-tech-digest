<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往期週報目錄 - AI 技術情報與趨勢週報</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-primary: #58a6ff;
            --accent-gradient: linear-gradient(135deg, #1f6feb, #388bfd);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --transition-speed: 0.25s;
        }

        [data-theme="light"] {
            --bg-color: #f6f8fa;
            --surface-color: #ffffff;
            --surface-hover: #f3f4f6;
            --border-color: #d0d7de;
            --text-primary: #1f2328;
            --text-secondary: #57606a;
            --text-muted: #6e7781;
            --accent-primary: #0969da;
            --accent-gradient: linear-gradient(135deg, #0969da, #218bff);
            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 1.5rem 1rem 3rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .brand-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-nav {
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
        }
        .btn-nav:hover {
            background: var(--surface-hover);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .intro-banner {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .archive-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .archive-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .archive-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .date-badge {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .period-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-action {
            margin-top: 0.5rem;
        }

        .btn-read {
            display: inline-block;
            background: var(--accent-primary);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
        }
        .btn-read:hover {
            opacity: 0.9;
        }

        .empty-notice {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        footer {
            text-align: center;
            padding: 3rem 0 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 class="brand-title">📚 往期週報存檔目錄</h1>
                <div class="brand-sub">AI 技術情報與趨勢週報 · 保留最近 30 天歷期前沿情報</div>
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn-nav" title="返回最新一期週報">🏠 最新週報</a>
                <button class="btn-nav" id="themeToggleBtn" onclick="toggleTheme()">
                    <span id="themeIcon">☀️</span> 切換主題
                </button>
            </div>
        </header>

        <div class="intro-banner">
            💡 本目錄收錄最近 30 天內發行之每期技術情報看板，超過 30 天之過期存檔由自動化管線定期滾動清除。點擊卡片即可重溫當期完整情報。
        </div>

        <main class="archive-grid">
            
        <div class="archive-card">
            <div class="card-meta">
                <span class="date-badge">📅 2026-10-31</span>
                <span class="period-badge">週期: 2026-W44</span>
            </div>
            <h3 class="card-title">AI 技術情報與趨勢週報 · 2026-10-31 出刊</h3>
            <p class="card-desc">收錄全球前沿模型革新、工程落地實踐、前沿研究與業界重要 AI 技術脈動。</p>
            <div class="card-action">
                <a href="digest_20261031.html" class="btn-read">查閱本期完整週報 ↗</a>
            </div>
        </div>
        
        </main>

        <footer>
            🤖 本看板由【AI情報週報公司】自動化管線生成 · 繁體中文台灣科技用語校準
        </footer>
    </div>

    <script>
        function initTheme() {
            const saved = localStorage.getItem("digest_theme") || "dark";
            document.documentElement.setAttribute("data-theme", saved);
            updateThemeIcon(saved);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme") || "dark";
            const target = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", target);
            localStorage.setItem("digest_theme", target);
            updateThemeIcon(target);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById("themeIcon");
            if (icon) {
                icon.textContent = theme === "dark" ? "☀️" : "🌙";
            }
        }

        initTheme();
    </script>
</body>
</html>
